    description: "Medium tracking shot from front as Evan reaches out to stop Ruby."
    start: 4.042
    end: 4.583
    stage_camera:
      target: "evan"
      target_offset: [0.3, -0.15, 0]
      focus: "evan"
      dof: "shallow"
      aperture: "f/2.8"
      maneuver: "dolly"
      easing: "deccel"
      distance_start: 1.9
      distance_end: 1.6
      pitch: 4
      yaw: 75
      lens: 50mm
    entities:
      evan: { highlighted: true, note: "Grabs Ruby's right arm" }

  # --- SHOT 5 (4.583s - 6.208s) ---
  - id: "shot-05"
    shot: 5
