# ==============================================================================
# 1. SCENE METADATA, VIDEO BINDING & GLOBAL OPTICS
# ==============================================================================
version: "1.0"
id: "vector-field-taruma-sakti"
title: "Vector Field"
subtitle: "Directed by Taruma Sakti — 32-Shot Spatial Choreography Breakdown"
video: "https://www.youtube.com/watch?v=1ly8QX31Uqw"
aspect_ratio: "21:9"
duration: 61.625
continuous: false

optics:
  dof_blur: true
  dof: "medium"
  aperture: "f/4.0"

# ==============================================================================
# 2. STAGE GEOMETRY & BASELINE CAMERAS
# ==============================================================================
stage:
  width: 32
  depth: 32
  grid_step: 2
  show_rigs: true

  observer_camera:
    target: [-11.5, 1.0, 0]
    distance: 12.0
    pitch: 22
    yaw: 10
    roll: 0
    lens: 35mm

  stage_camera:
    target: "ruby"
    distance: 1.8
    pitch: 4
    yaw: 90
    roll: 0
    lens: 50mm

# ==============================================================================
# 3. SCENE ENTITIES (WITH 3D SHAPES, STYLES & DIMENSIONS)
# ==============================================================================
entities:
  - id: "ruby"
    label: "Ruby"
    kind: "character"
    style: "mannequin"
    position: [-11.5, 0, 0]
    rotation: 90
    size: [0.48, 1.70, 0.36]
    color: "#f97316"

  - id: "evan"
    label: "Evan"
    kind: "character"
    style: "mannequin"
    position: [-13.2, 0, 0]
    rotation: 90
    size: [0.54, 1.80, 0.40]
    color: "#38bdf8"

  - id: "artifact"
    label: "Vector Disc"
    kind: "prop"
    shape: "cylinder"
    style: "solid"
    position: [-11.5, 0.9, 0]
    rotation: 0
    size: [0.36, 0.08, 0.36]
    color: "#f59e0b"

  - id: "bag_cloth"
    label: "Cloth Wrap"
    kind: "marker"
    shape: "puck"
    style: "tape"
    position: [0, 0, 0]
    rotation: 0
    size: [0.45, 0.04, 0.45]
    color: "#d6d3d1"

  - id: "node_north"
    label: "North Glyph Node"
    kind: "marker"
    shape: "circle"
    style: "glow"
    position: [0, 0, -10.0]
    height: 0.10
    radius: 0.80
    color: "#fb923c"

  - id: "node_south"
    label: "South Glyph Node"
    kind: "marker"
    shape: "circle"
    style: "glow"
    position: [0, 0, 10.0]
    height: 0.10
    radius: 0.80
    color: "#fb923c"

  - id: "node_east"
    label: "East Glyph Node"
    kind: "marker"
    shape: "circle"
    style: "glow"
    position: [10.0, 0, 0]
    height: 0.10
    radius: 0.80
    color: "#fb923c"

  - id: "node_west"
    label: "West Glyph Node"
    kind: "marker"
    shape: "circle"
    style: "glow"
    position: [-10.0, 0, 0]
    height: 0.10
    radius: 0.80
    color: "#fb923c"

# ==============================================================================
# 4. DECOUPLED BLOCKING TIMELINE (blocking:)
# ==============================================================================
blocking:
  # --- Initial Visibility Setup ---
  - id: "init-props-hidden"
    start: 0.000
    end: 0.100
    entities:
      artifact: { cut: true, position: [-11.5, 0.9, 0], visible: false }
      bag_cloth: { cut: true, position: [0, 0, 0], visible: false }
      node_north: { cut: true, position: [0, 0, -10.0], visible: false }
      node_south: { cut: true, position: [0, 0, 10.0], visible: false }
      node_east: { cut: true, position: [10.0, 0, 0], visible: false }
      node_west: { cut: true, position: [-10.0, 0, 0], visible: false }

  # --- Shots 1–3: Cornfield Chase Sprint ---
  - id: "chase-sprint-1"
    start: 0.000
    end: 4.042
    easing: "linear"
    entities:
      ruby:
        from: [-11.5, 0, 0]
        position: [-6.0, 0, 0]
        rotation: 90
      evan:
        from: [-13.2, 0, 0]
        position: [-6.8, 0, 0]
        rotation: 90
        look_at: "ruby"

  # --- Shots 4–6: Evan Grabs Ruby's Injured Arm ---
  - id: "arm-grab-stop"
    start: 4.042
    end: 6.792
    easing: "ease-out"
    entities:
      ruby:
        from: [-6.0, 0, 0]
        position: [-5.5, 0, 0]
        rotation: 65
      evan:
        from: [-6.8, 0, 0]
        position: [-6.1, 0, 0.15]
        look_at: "ruby"

  # --- Shots 7–9: Ruby Confronts Evan & Turns to Run ---
  - id: "ruby-confronts-evan"
    start: 6.792
    end: 8.875
    easing: "smooth"
    entities:
      ruby:
        position: [-5.5, 0, 0]
        look_at: "evan"
      evan:
        position: [-6.1, 0, 0.15]
        look_at: "ruby"

  # --- Shots 10–11: Sprint into the Central Clearing ---
  - id: "sprint-into-clearing"
    start: 8.875
    end: 11.400
    easing: "deccel"
    entities:
      ruby:
        from: [-5.5, 0, 0]
        position: [1.1, 0, 0]
        rotation: 90
      evan:
        from: [-6.1, 0, 0.15]
        position: [-1.0, 0, 0]
        rotation: 90

  # --- Shot 11 Tail & Shot 12: Evan Bends Over Catching Breath & Ruby Opens Bag ---
  - id: "clearing-recovery"
    start: 11.400
    end: 14.417
    easing: "smooth"
    entities:
      ruby:
        position: [1.0, 0, 0]
        look_at: "evan"
      evan:
        position: [-0.9, 0, 0]
        from_height: 1.80
        height: 1.35
        look_at: "ruby"

  # --- Shots 13–17: Stepping Together & Handing Over the Artifact ---
  - id: "artifact-handoff"
    start: 14.417
    end: 17.208
    easing: "smooth"
    entities:
      ruby:
        from: [1.0, 0, 0]
        position: [0.42, 0, 0.05]
        look_at: "evan"
      evan:
        from: [-0.9, 0, 0]
        position: [-0.42, 0, 0]
        from_height: 1.35
        height: 1.80
        look_at: "ruby"
      artifact:
        cut: true
        position: [0, 1.15, 0.02]
        size: [0.36, 0.24, 0.12]
        visible: true

  # --- Shots 14–18: Argument Over the Artifact ---
  - id: "argument-hold"
    start: 17.208
    end: 25.042
    easing: "smooth"
    entities:
      ruby:
        position: [0.42, 0, 0.05]
        look_at: "evan"
      evan:
        position: [-0.42, 0, 0]
        height: 1.80
        look_at: "ruby"
      artifact:
        position: [0, 1.12, 0.02]
        visible: true

  # --- Shot 18: Dropping the Activating Artifact ---
  - id: "artifact-drop"
    start: 25.042
    end: 25.667
    easing: "accel"
    entities:
      ruby:
        from: [0.42, 0, 0.05]
        position: [0.85, 0, 0]
        look_at: "evan"
      evan:
        from: [-0.42, 0, 0]
        position: [-0.85, 0, 0]
        look_at: "ruby"
      artifact:
        from: [0, 1.12, 0.02]
        position: [0, 0.22, 0]
        size: [0.36, 0.36, 0.08]
        visible: true
      bag_cloth:
        cut: true
        position: [0, 0, 0]
        visible: true

  # --- Shot 19: Artifact Levitates Between Them ---
  - id: "artifact-levitate"
    start: 25.667
    end: 30.208
    easing: "cruise"
    entities:
      ruby:
        from: [0.85, 0, 0]
        position: [1.05, 0, 0]
        look_at: "artifact"
      evan:
        from: [-0.85, 0, 0]
        position: [-1.05, 0, 0]
        look_at: "artifact"
      artifact:
        from: [0, 0.22, 0]
        position: [0, 1.25, 0]
        from_size: [0.36, 0.36, 0.08]
        size: [0.36, 0.08, 0.36]
        rotation: 180
        visible: true

  # --- Shots 20–26: Hovering Standoff in the Clearing ---
  - id: "artifact-hover-standoff"
    start: 30.208
    end: 42.083
    easing: "smooth"
    entities:
      ruby:
        from: [1.05, 0, 0]
        position: [1.20, 0, 0]
        look_at: "evan"
      evan:
        from: [-1.05, 0, 0]
        position: [-1.20, 0, 0]
        look_at: "ruby"
      artifact:
        position: [0, 1.25, 0]
        size: [0.36, 0.36, 0.08]
        rotation: 0
        visible: true

  # --- Shot 27: Artifact Slams Down & Shockwave Recoil (Actors Brace/Crouch) ---
  - id: "artifact-slam-shockwave"
    start: 42.083
    end: 43.292
    easing: "pop"
    entities:
      artifact:
        from: [0, 1.25, 0]
        position: [0, 0.05, 0]
        from_size: [0.36, 0.36, 0.08]
        size: [0.36, 0.08, 0.36]
        visible: true
      evan:
        from: [-1.20, 0, 0]
        position: [-1.65, 0, 0]
        from_height: 1.80
        height: 1.40
        look_at: "artifact"
      ruby:
        from: [1.20, 0, 0]
        position: [1.65, 0, 0]
        from_height: 1.70
        height: 1.35
        look_at: "artifact"
      node_north: { cut: true, position: [0, 0, -10.0], visible: true }
      node_south: { cut: true, position: [0, 0, 10.0], visible: true }
      node_east: { cut: true, position: [10.0, 0, 0], visible: true }
      node_west: { cut: true, position: [-10.0, 0, 0], visible: true }

  # --- Shots 28–32: Final Clearing Hold Under Crop Circle ---
  - id: "final-clearing-hold"
    start: 43.292
    end: 61.625
    easing: "smooth"
    entities:
      evan:
        position: [-1.65, 0, 0]
        from_height: 1.40
        height: 1.75
        look_at: "artifact"
      ruby:
        position: [1.65, 0, 0]
        from_height: 1.35
        height: 1.68
        look_at: "artifact"
      artifact:
        position: [0, 0.45, 0]
        size: [0.36, 0.08, 0.36]
        visible: true

# ==============================================================================
# 5. FILM COVERAGE SHOTS & STAGE CAMERA (32 Shots with Rigs, Centroids & DoF)
# ==============================================================================
shots:
  # --- SHOT 1 (0.000s - 1.042s) ---
  - id: "shot-01"
    shot: 1
    label: "Lead Track on Ruby Sprinting"
    description: "Handheld backward lead track in front of Ruby running through corn stalks."
    start: 0.000
    end: 1.042
    stage_camera:
      target: "ruby"
      focus: "ruby"
      dof: "shallow"
      aperture: "f/2.8"
      maneuver: "dolly"
      easing: "linear"
      distance_start: 1.7
      distance_end: 1.5
      pitch: -4
      yaw: 90
      roll: 2
      lens: 35mm
    entities:
      ruby: { highlighted: true, note: "Sprinting through corn row" }

  # --- SHOT 2 (1.042s - 2.708s) ---
  - id: "shot-02"
    shot: 2
    label: "Lead Track on Evan Chasing Ruby"
    description: "Camera leads Evan past Ruby's shoulder as she crosses foreground right."
    start: 1.042
    end: 2.708
    stage_camera:
      target: "evan"
      focus: "evan"
      dof: "shallow"
      aperture: "f/2.8"
      maneuver: "dolly"
      easing: "linear"
      distance_start: 2.4
      distance_end: 1.8
      pitch: 2
      yaw_start: 80
      yaw_end: 68
      lens: 50mm
    entities:
      evan: { highlighted: true, note: "Chasing behind Ruby" }
      ruby: { highlighted: false }

  # --- SHOT 3 (2.708s - 4.042s) ---
  - id: "shot-03"
    shot: 3
    label: "Lateral Side-Profile Dolly Track"
    description: "Parallel linear dolly track through dense corn stalks framing both runners' centroid."
    start: 2.708
    end: 4.042
    stage_camera:
      target: ["evan", "ruby"]
      focus: ["evan", "ruby"]
      dof: "medium"
      aperture: "f/5.6"
      rig:
        type: "track"
        from: [-10.5, 1.35, 4.2]
        to: [-6.4, 1.35, 4.2]
      easing: "linear"
      lens: 35mm
    entities:
      ruby: { highlighted: true }
      evan: { highlighted: true }

  # --- SHOT 4 (4.042s - 4.583s) ---
