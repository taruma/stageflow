# ==============================================================================
# STAGEPLAY BLUEPRINT 02 — CINEMATIC DIALOGUE FLOW
# ==============================================================================
# A multi-shot dialogue coverage sequence demonstrating:
#   1. Wide Master Establishing Tracking Shot (35mm Dolly)
#   2. Classic Over-The-Shoulder (50mm OTS on Subject A)
#   3. Reverse-Angle OTS (50mm OTS on Subject B, 180° conversational axis)
#   4. Dynamic Low-Angle Hero Arc (85mm Bezier Sweep)
#   5. Multi-Waypoint Catmull-Rom Spline Bridge (Connecting both actors)
#   6. High-Angle Crane Pullback Orbit (35mm Diorama Resolve)
#
# Units:
#   - Spatial Coordinates & Distances: Metric Meters (1 unit = 1m)
#   - Angles (pitch, yaw, rotation): Human Degrees (deg)
#   - Optics (lens): Full-Frame Equivalent Focal Length in Millimeters (mm)

version: "1.0"
id: "blueprint-02-dialogue"
title: "Blueprint 02: Cinematic Dialogue Flow"
subtitle: "Multi-Shot Dialogue · Reverse Angles · Dolly, Arc & Spline Maneuvers"
video: "procedural://dialogue-flow"
aspect_ratio: "16:9"
duration: 26.0

stage:
  width: 10
  depth: 10
  grid_step: 1
  observer_camera:
    target: [0, 1.1, 0]
    distance: 8.5
    pitch: 28
    yaw: 35
    lens: 35mm
  stage_camera:
    target: [0, 1.25, 0]
    distance: 5.5
    pitch: 10
    yaw: 0
    lens: 35mm

entities:
  - id: "protagonist"
    label: "Subject A (Lead)"
    kind: "character"
    position: [-0.9, 0, 0]
    rotation: 90
    color: "#38bdf8"

  - id: "interlocutor"
    label: "Subject B (Partner)"
    kind: "character"
    position: [0.9, 0, 0]
    rotation: -90
    color: "#a78bfa"

shots:
  # Shot 1: Wide Master Establishing Two-Shot
  - id: "shot-1"
    shot: 1
    label: "Shot 01 · Wide Master Establishing"
    description: "35mm Wide Master Two-Shot. Slow tracking push-in establishing the spatial confrontation between Subject A and Subject B."
    start: 0.0
    end: 5.0
    stage_camera:
      target: [0, 1.25, 0]
      maneuver: "dolly"
      easing: "smooth"
      distance_start: 5.5
      distance_end: 4.4
      pitch_start: 10
      pitch_end: 7
      yaw_start: 0
      yaw_end: 0
      lens: 35mm
      show_path: true
    observer_camera:
      target: [0, 1.1, 0]
      maneuver: "orbit"
      easing: "smooth"
      distance: 8.5
      pitch: 28
      yaw_start: 35
      yaw_end: 45
      lens: 35mm
    entities:
      protagonist:
        highlighted: false
        look_at: "interlocutor"
      interlocutor:
        highlighted: false
        look_at: "protagonist"

  # Shot 2: Cut to Over-The-Shoulder (OTS) on Subject A
  - id: "shot-2"
    shot: 2
    label: "Shot 02 · Cut to OTS on Subject A"
    description: "50mm Over-the-Shoulder on Subject A. Slow emotional push past Subject B's foreground shoulder."
    start: 5.0
    end: 9.0
    stage_camera:
      target: "protagonist"
      maneuver: "dolly"
      easing: "smooth"
      distance_start: 2.8
      distance_end: 2.3
      pitch_start: 6
      pitch_end: 4
      yaw_start: 130
      yaw_end: 138
      lens: 50mm
      show_path: true
    observer_camera:
      target: "protagonist"
      maneuver: "dolly"
      easing: "smooth"
      distance_start: 8.5
      distance_end: 6.2
      pitch_start: 28
      pitch_end: 22
      yaw_start: 45
      yaw_end: 68
      lens: 35mm
    entities:
      protagonist:
        highlighted: true
        look_at: "interlocutor"
      interlocutor:
        highlighted: false
        look_at: "protagonist"

  # Shot 3: Reverse Cut to OTS on Subject B (Preserving 180° Axis)
  - id: "shot-3"
    shot: 3
    label: "Shot 03 · Reverse OTS Cut on Subject B"
    description: "50mm Reverse OTS on Subject B, strictly adhering to the 180° conversational line."
    start: 9.0
    end: 13.0
    stage_camera:
      target: "interlocutor"
      maneuver: "dolly"
      easing: "smooth"
      distance_start: 2.8
      distance_end: 2.3
      pitch_start: 6
      pitch_end: 4
      yaw_start: -130
      yaw_end: -138
      lens: 50mm
      show_path: true
    observer_camera:
      target: "interlocutor"
      maneuver: "orbit"
      easing: "smooth"
      distance: 6.2
      pitch: 22
      yaw_start: 68
      yaw_end: -55
      lens: 35mm
    entities:
      protagonist:
        highlighted: false
        look_at: "interlocutor"
      interlocutor:
        highlighted: true
        look_at: "protagonist"

  # Shot 4: 85mm Low-Angle Hero Arc
  - id: "shot-4"
    shot: 4
    label: "Shot 04 · 85mm Low-Angle Hero Arc"
    description: "85mm Hero Arc sweeping 75° around Subject A, lowering camera elevation into an intense upward angle."
    start: 13.0
    end: 17.5
    stage_camera:
      target: "protagonist"
      maneuver: "arc"
      easing: "smooth"
      distance_start: 2.5
      distance_end: 1.9
      pitch_start: 5
      pitch_end: -3
      yaw_start: -130
      yaw_end: -55
      lens: 85mm
      show_path: true
    observer_camera:
      target: "protagonist"
      maneuver: "orbit"
      easing: "smooth"
      distance: 6.5
      pitch: 20
      yaw_start: -55
      yaw_end: -20
      lens: 35mm
    entities:
      protagonist:
        highlighted: true
        look_at: "interlocutor"
      interlocutor:
        highlighted: false
        look_at: "protagonist"

  # Shot 5: 3-Waypoint Catmull-Rom Spline Bridge
  - id: "shot-5"
    shot: 5
    label: "Shot 05 · Catmull-Rom Spline Bridge"
    description: "Fluid 3D Catmull-Rom spline glide traversing from Subject A across the center to Subject B."
    start: 17.5
    end: 21.5
    stage_camera:
      maneuver: "spline"
      easing: "smooth"
      show_path: true
      waypoints:
        - target: "protagonist"
          distance: 2.1
          pitch: 1
          yaw: -45
          lens: 50mm
        - target: [0, 1.25, 0]
          distance: 3.0
          pitch: 8
          yaw: 0
          lens: 50mm
        - target: "interlocutor"
          distance: 2.0
          pitch: -2
          yaw: 45
          lens: 85mm
    observer_camera:
      target: [0, 1.1, 0]
      maneuver: "orbit"
      easing: "smooth"
      distance: 7.5
      pitch: 26
      yaw_start: -20
      yaw_end: 35
      lens: 35mm
    entities:
      protagonist:
        highlighted: true
        look_at: "interlocutor"
      interlocutor:
        highlighted: true
        look_at: "protagonist"

  # Shot 6: High-Angle Pullback Crane Orbit
  - id: "shot-6"
    shot: 6
    label: "Shot 06 · High-Angle Crane Orbit Pullback"
    description: "35mm crane elevation rise to 30° and 70° orbit pullback resolving the spatial diorama."
    start: 21.5
    end: 26.0
    stage_camera:
      target: [0, 1.25, 0]
      maneuver: "orbit"
      easing: "smooth"
      distance_start: 3.0
      distance_end: 6.2
      pitch_start: 6
      pitch_end: 30
      yaw_start: 45
      yaw_end: 115
      lens: 35mm
      show_path: true
    observer_camera:
      target: [0, 1.1, 0]
      maneuver: "orbit"
      easing: "smooth"
      distance: 8.5
      pitch: 32
      yaw_start: 35
      yaw_end: 75
      lens: 35mm
    entities:
      protagonist:
        highlighted: false
        look_at: "interlocutor"
      interlocutor:
        highlighted: false
        look_at: "protagonist"
